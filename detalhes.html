<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Detalhes do local em João Pessoa, Paraíba — Aonde." />
  <title>Detalhes — Aonde João Pessoa</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            coral: '#E14D2A',
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            serif: ['"Instrument Serif"', 'Georgia', 'serif'],
          }
        }
      }
    };
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Leaflet Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="min-h-screen flex flex-col selection:bg-coral selection:text-white">

  <!-- ─── TOP NAVBAR ───────────────────────────────────────────────── -->
  <header class="sticky top-0 z-40 bg-[#F6F5F2]/85 dark:bg-[#0B0D11]/85 backdrop-blur-xl border-b border-black/[0.06] dark:border-white/[0.07]">
    <div class="max-w-6xl mx-auto px-4 sm:px-8 h-20 flex items-center justify-between gap-4">

      <!-- Back Button -->
      <a id="back-link" href="index.html"
         class="inline-flex items-center gap-2 text-xs font-semibold text-neutral-700 dark:text-neutral-200
                px-4 py-2.5 rounded-full bg-white dark:bg-neutral-900 border border-neutral-200/90 dark:border-neutral-800
                hover:border-coral transition group">
        <svg class="w-4 h-4 text-neutral-400 group-hover:text-coral group-hover:-translate-x-0.5 transition-all" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="m15 18-6-6 6-6"/>
        </svg>
        <span>Voltar ao guia</span>
      </a>

      <!-- Brand Logo Center -->
      <a href="index.html" class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-coral text-white flex items-center justify-center font-serif italic text-xl">
          a
        </div>
        <span class="font-serif text-2xl tracking-tight text-neutral-900 dark:text-white">Aonde</span>
      </a>

      <!-- Right Actions: Favorite & Theme -->
      <div class="flex items-center gap-2.5">
        <button id="detail-fav-btn" type="button"
                class="fav-trigger inline-flex items-center gap-2 px-4 py-2.5 rounded-full text-xs font-semibold
                       bg-white dark:bg-neutral-900 border border-neutral-200/90 dark:border-neutral-800
                       text-neutral-700 dark:text-neutral-200 hover:border-coral transition">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
          </svg>
          <span id="detail-fav-label">Salvar</span>
        </button>

        <button id="theme-toggle-btn" type="button"
                class="w-10 h-10 rounded-full bg-white dark:bg-neutral-900 border border-neutral-200/90 dark:border-neutral-800
                       flex items-center justify-center text-neutral-700 dark:text-neutral-300 hover:border-coral transition"
                aria-label="Alternar tema">
          <svg id="theme-icon-sun" class="hidden" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/>
            <path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/>
            <path d="m19.07 4.93-1.41 1.41"/>
          </svg>
          <svg id="theme-icon-moon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ─── DETAIL PAGE CONTENT ──────────────────────────────────────── -->
  <main id="detail-root" class="max-w-6xl w-full mx-auto px-4 sm:px-8 pt-8 pb-20 flex-1"></main>

  <!-- ─── TOAST ────────────────────────────────────────────────────── -->
  <div id="toast-notification"
       class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 pointer-events-none transition-all duration-300">
    <div class="bg-neutral-900 dark:bg-white text-white dark:text-neutral-900 px-4 py-2.5 rounded-full shadow-xl text-xs font-semibold">
      <span id="toast-message"></span>
    </div>
  </div>

  <!-- ─── FOOTER ───────────────────────────────────────────────────── -->
  <footer class="border-t border-black/[0.06] dark:border-white/[0.07] py-10 px-4 sm:px-8 mt-auto">
    <div class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-neutral-400">
      <div class="flex items-center gap-2">
        <span class="font-serif italic text-xl text-neutral-800 dark:text-neutral-200">Aonde</span>
        <span>· Curadoria independente de João Pessoa, Paraíba</span>
      </div>
      <div>
        Dados cartográficos <a href="https://www.openstreetmap.org" target="_blank" rel="noopener" class="underline hover:text-coral">OpenStreetMap</a>
      </div>
    </div>
  </footer>

  <script type="module" src="js/detail.js"></script>
</body>
</html>
